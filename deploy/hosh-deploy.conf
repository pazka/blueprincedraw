# Read ONCE by `hosh-deploy register blueprincedraw` on the box (box standard, Decision #16), which
# validates the compose hardening and pins the result in /etc/hosh-deploy/apps/blueprincedraw.conf.
# Changing this file in the repo changes nothing on the box until someone re-registers there.
SERVICE=blueprincedraw
IMAGE_REPO=ghcr.io/pazka/blueprincedraw
IMAGE_VAR=APP_IMAGE
ENV_FILE=blueprincedraw.env
HOST=excalidraw.hosh.it
BIND=127.0.0.1:9132
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero ⇒ auto-rollback):
# page + strict CSP, bundle (brotli, immutable), local fonts/locales, 404 on dotfiles/sources, 405 on writes.
POST_DEPLOY=/nodejs/bin/node /app/server/smoke.js http://127.0.0.1:8000
REPO=pazka/blueprincedraw
